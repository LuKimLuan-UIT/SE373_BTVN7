<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>LangGraph Memory Lab</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8b93a7; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; }
  aside { width:280px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  main { flex:1; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:16px; margin:0; }
  .muted { color:var(--muted); font-size:12px; }
  .pad { padding:14px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
  button:hover { filter:brightness(1.1); }
  #sessions { flex:1; overflow:auto; padding:0 10px; }
  .session { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .session:hover { background:#1f2430; }
  .session.active { background:#223055; }
  .session .del { color:var(--muted); font-size:15px; }
  #memory { border-top:1px solid var(--line); max-height:38%; overflow:auto; }
  #memory li { font-size:12px; margin-bottom:4px; color:var(--muted); }
  #memory pre, #context pre { font-size:11px; line-height:1.45; color:var(--muted); white-space:pre-wrap; background:#12151b; border:1px solid var(--line); border-radius:8px; padding:10px; margin:0; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs button { background:transparent; border:1px solid var(--line); color:var(--muted); padding:4px 10px; font-size:12px; }
  .tabs button.active { border-color:var(--accent); color:#fff; }
  #chat { flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.5; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  #composer { display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; }
  .err { color:#ff8080; padding:0 18px 10px; font-size:13px; }
</style>
</head>
<body>
<aside>
  <div class="pad">
    <button style="width:100%" onclick="newSession()">+ Session mới</button>
  </div>
  <div id="sessions"></div>
  <div id="memory" class="pad">
    <div class="muted" style="margin-bottom:8px">🧠 Memory (MEMORY.md)</div>
    <div class="tabs">
      <button id="tab-index" class="active" onclick="showTab('index')">Index</button>
      <button id="tab-entries" onclick="showTab('entries')">Chi tiết</button>
      <button id="tab-context" onclick="showTab('context')">Context</button>
    </div>
    <pre id="memory-index"></pre>
    <ul id="memory-list" style="padding-left:18px;margin:8px 0 0;display:none"></ul>
    <pre id="memory-context" style="display:none"></pre>
  </div>
</aside>
<main>
  <header>
    <div>
      <h1>LangGraph Persistent Memory Lab</h1>
      <div class="muted" id="status">Đang kết nối…</div>
    </div>
    <div class="muted" id="current"></div>
  </header>
  <div id="chat"></div>
  <div id="error" class="err"></div>
  <div id="composer">
    <input type="text" id="input" placeholder="Nhập tin nhắn… (thử: “Tôi tên là An, tôi thích Python”)" onkeydown="if(event.key==='Enter') send()" />
    <button onclick="send()">Gửi</button>
  </div>
</main>

<script>
let threadId = null;

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const data = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(data.detail || res.statusText);
  }
  return res.json();
}

function showError(message) {
  document.getElementById('error').textContent = message || '';
}

async function boot() {
  try {
    const health = await api('/api/health');
    if (!health.ok) throw new Error(health.detail);
    document.getElementById('status').textContent = 'Sẵn sàng · user: ' + health.user_id;
    const sessions = await api('/api/sessions');
    if (sessions.length) {
      threadId = sessions[0].thread_id;
    } else {
      threadId = (await api('/api/sessions/new', { method: 'POST' })).thread_id;
    }
    await selectSession(threadId);
    await refreshMemory();
  } catch (e) {
    showError(e.message);
    document.getElementById('status').textContent = 'Lỗi khởi động';
  }
}

async function refreshSessions() {
  const sessions = await api('/api/sessions');
  const box = document.getElementById('sessions');
  box.innerHTML = '';
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'session' + (s.thread_id === threadId ? ' active' : '');
    div.innerHTML = `<span>${escapeHtml(s.title)}</span><span class="del" title="xoá">🗑</span>`;
    div.querySelector('span').onclick = () => selectSession(s.thread_id);
    div.querySelector('.del').onclick = (e) => { e.stopPropagation(); removeSession(s.thread_id); };
    box.appendChild(div);
  }
}

async function refreshMemory() {
  const data = await api('/api/memory');
  document.getElementById('memory-index').textContent = data.index || '(chưa có memory)';
  const list = document.getElementById('memory-list');
  list.innerHTML = data.entries.length
    ? data.entries.map(e => {
        const mark = e.status === 'active' ? '' : ` <span class="muted">[superseded → ${escapeHtml(e.superseded_by)}]</span>`;
        return `<li>[${escapeHtml(e.topic)}] ${escapeHtml(e.content)} <span class="muted">(${escapeHtml(e.key)})</span>${mark}</li>`;
      }).join('')
    : '<li class="muted">Chưa có mục memory nào</li>';
}

function showTab(tab) {
  const index = document.getElementById('memory-index');
  const entries = document.getElementById('memory-list');
  const context = document.getElementById('memory-context');
  index.style.display = tab === 'index' ? 'block' : 'none';
  entries.style.display = tab === 'entries' ? 'block' : 'none';
  context.style.display = tab === 'context' ? 'block' : 'none';
  for (const name of ['index', 'entries', 'context']) {
    document.getElementById('tab-' + name).classList.toggle('active', name === tab);
  }
  if (tab === 'context') {
    api('/api/context').then(d => { document.getElementById('memory-context').textContent = d.context; });
  }
}

function escapeHtml(text) {
  return (text || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function selectSession(id) {
  threadId = id;
  document.getElementById('current').textContent = 'thread: ' + id;
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  const history = await api('/api/messages/' + id);
  for (const m of history) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'human' ? 'user' : 'bot');
    div.textContent = m.content;
    chat.appendChild(div);
  }
  await refreshSessions();
}

async function newSession() {
  threadId = (await api('/api/sessions/new', { method: 'POST' })).thread_id;
  await selectSession(threadId);
}

async function removeSession(id) {
  await api('/api/sessions/' + id, { method: 'DELETE' });
  if (id === threadId) await newSession(); else await refreshSessions();
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !threadId) return;
  input.value = '';
  showError('');
  const chat = document.getElementById('chat');
  const user = document.createElement('div');
  user.className = 'msg user';
  user.textContent = text;
  chat.appendChild(user);
  try {
    const data = await api('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: threadId, message: text }),
    });
    const bot = document.createElement('div');
    bot.className = 'msg bot';
    bot.textContent = data.reply;
    chat.appendChild(bot);
    chat.scrollTop = chat.scrollHeight;
    await refreshSessions();
    await refreshMemory();
  } catch (e) {
    showError(e.message);
  }
}

boot();
</script>
</body>
</html>
